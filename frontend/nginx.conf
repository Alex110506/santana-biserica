server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Vite emits content-hashed filenames under /assets/, safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Admin area: served as the SPA shell, but explicitly kept out of search
    # engines. `try_files /index.html =404` serves the file *in this location*
    # (a plain `/index.html` fallback would internally redirect and lose the
    # header below).
    location ~ ^/(login|admin) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Never cache the HTML shell, so deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
