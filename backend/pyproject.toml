[project]
name = "santana-biserica-backend"
version = "0.1.0"
description = "FastAPI backend (CMS API) for the Sântana church website."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "pymongo>=4.9.0",
    "redis>=5.2.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "slowapi>=0.1.10",
    "aioboto3>=15.5.0",
    "nh3>=0.3.6",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI relies on function calls (Depends, Cookie, Query, …) in argument
# defaults; these are safe, so exclude them from B008.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Cookie",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]
