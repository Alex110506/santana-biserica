<svg width="100%" viewBox="0 0 840 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title style="font-family: system-ui, sans-serif;">Church CMS Architecture - Decoupled</title>
  <desc style="font-family: system-ui, sans-serif;">Architecture diagram showing a React Frontend interacting with a FastAPI Backend. A separate Web Scraper runs as a Cron Job. Both the backend and scraper communicate with an independent Redis node. The backend connects to an external MongoDB instance and Cloudflare CDN.</desc>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ================= EXTERNAL SERVICES ================= -->
  <g>
    <!-- MongoDB Instance -->
    <rect x="70" y="20" width="180" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
    <text x="160" y="38" text-anchor="middle" dominant-baseline="central" style="fill:#085041; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">MongoDB Instance</text>
    <text x="160" y="58" text-anchor="middle" dominant-baseline="central" style="fill:#0f6e56; font-family: system-ui, sans-serif; font-size: 12px;">Database (NoSQL)</text>

    <!-- Cloudflare CDN -->
    <rect x="330" y="20" width="180" height="56" rx="8" fill="#fcfcfb" stroke="#e5e5e5" stroke-width="1"/>
    <text x="420" y="38" text-anchor="middle" dominant-baseline="central" style="fill:#111; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Cloudflare CDN</text>
    <text x="420" y="58" text-anchor="middle" dominant-baseline="central" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 12px;">Image &amp; Media Delivery</text>
    
    <!-- External Orthodox Website -->
    <rect x="620" y="20" width="180" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="710" y="38" text-anchor="middle" dominant-baseline="central" style="fill:#334155; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">External Website</text>
    <text x="710" y="58" text-anchor="middle" dominant-baseline="central" style="fill:#475569; font-family: system-ui, sans-serif; font-size: 12px;">Orthodox Calendar Data</text>
  </g>

  <!-- ================= RAILWAY PRIVATE NETWORK ================= -->
  <rect x="20" y="120" width="800" height="280" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="145" style="fill:#475569; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600;">Railway Private Network</text>

  <!-- Connection: Backend to External -->
  <line x1="160" y1="170" x2="160" y2="80" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <line x1="280" y1="170" x2="380" y2="80" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <!-- Connection: Scraper to External -->
  <line x1="710" y1="170" x2="710" y2="80" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>

  <g>
    <!-- 1. FastAPI Backend Node -->
    <rect x="40" y="170" width="280" height="210" rx="12" fill="#fafafa" stroke="#d4d4d8" stroke-width="1"/>
    <text x="180" y="195" text-anchor="middle" style="fill:#111; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">FastAPI Backend Node</text>

    <!-- Backend Modules -->
    <rect x="60" y="215" width="240" height="60" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
    <text x="180" y="235" text-anchor="middle" dominant-baseline="central" style="fill:#3c3489; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Auth &amp; Routing</text>
    <text x="180" y="255" text-anchor="middle" dominant-baseline="central" style="fill:#534ab7; font-family: system-ui, sans-serif; font-size: 12px;">JWT / Mongo Auth</text>

    <rect x="60" y="295" width="240" height="60" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
    <text x="180" y="315" text-anchor="middle" dominant-baseline="central" style="fill:#3c3489; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">CMS Controllers</text>
    <text x="180" y="335" text-anchor="middle" dominant-baseline="central" style="fill:#534ab7; font-family: system-ui, sans-serif; font-size: 12px;">Collection CRUD API</text>

    <!-- 2. Decoupled Redis Node -->
    <rect x="360" y="210" width="120" height="130" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="420" y="240" text-anchor="middle" dominant-baseline="central" style="fill:#991b1b; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600;">Redis Node</text>
    <text x="420" y="270" text-anchor="middle" dominant-baseline="central" style="fill:#dc2626; font-family: system-ui, sans-serif; font-size: 12px;">In-Memory</text>
    <text x="420" y="290" text-anchor="middle" dominant-baseline="central" style="fill:#dc2626; font-family: system-ui, sans-serif; font-size: 12px;">Cache</text>

    <!-- 3. Web Scraper Node -->
    <rect x="520" y="170" width="280" height="210" rx="12" fill="#f0fdf4" stroke="#166534" stroke-width="1"/>
    <text x="660" y="195" text-anchor="middle" style="fill:#111; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Web Scraper Node</text>

    <!-- Scraper Modules -->
    <rect x="540" y="215" width="240" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
    <text x="660" y="235" text-anchor="middle" dominant-baseline="central" style="fill:#166534; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Cron Job Service</text>
    <text x="660" y="255" text-anchor="middle" dominant-baseline="central" style="fill:#15803d; font-family: system-ui, sans-serif; font-size: 12px;">Scheduled Execution</text>

    <rect x="540" y="295" width="240" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
    <text x="660" y="315" text-anchor="middle" dominant-baseline="central" style="fill:#166534; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Data Extractor</text>
    <text x="660" y="335" text-anchor="middle" dominant-baseline="central" style="fill:#15803d; font-family: system-ui, sans-serif; font-size: 12px;">Parse &amp; Format JSON</text>
  </g>

  <!-- Internal Network Connections (To Redis) -->
  <!-- FastAPI Reads/Writes to Redis -->
  <line x1="320" y1="275" x2="355" y2="275" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <text x="340" y="260" text-anchor="middle" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 10px;">Read</text>
  
  <!-- Scraper Writes to Redis -->
  <line x1="520" y1="275" x2="485" y2="275" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <text x="500" y="260" text-anchor="middle" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 10px;">Write</text>


  <!-- ================= FRONTEND LAYER ================= -->
  <!-- Connection Backend to Frontend -->
  <line x1="180" y1="440" x2="180" y2="385" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <text x="190" y="415" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 12px;">REST API Requests</text>

  <rect x="20" y="440" width="800" height="150" rx="16" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="40" y="465" style="fill:#111; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Frontend Node (e.g., Vercel / Netlify)</text>

  <!-- Frontend Application (Public) -->
  <rect x="80" y="480" width="310" height="90" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
  <text x="235" y="515" text-anchor="middle" style="fill:#0369a1; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">React Application (Public)</text>
  <text x="235" y="540" text-anchor="middle" style="fill:#0284c7; font-family: system-ui, sans-serif; font-size: 12px;">Render Cache / API Data</text>

  <!-- Dynamic Admin Dashboard -->
  <rect x="450" y="480" width="290" height="90" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="595" y="515" text-anchor="middle" style="fill:#b45309; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Admin Dashboard</text>
  <text x="595" y="540" text-anchor="middle" style="fill:#d97706; font-family: system-ui, sans-serif; font-size: 12px;">Route: /{secret}/dashboard</text>

</svg>
